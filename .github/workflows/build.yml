name: Build

# Builds the versions and loaders that a push or pull request changes (see .github/scripts/plan_matrix.py), so a break shows
# up before a release. Docs, status and workflow only changes build nothing.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  plan:
    name: Pick the changed builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/plan_matrix.py build --before "$BEFORE" --sha "${{ github.sha }}"

  build:
    name: ${{ matrix.dir }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: versions/${{ matrix.dir }}
        run: |
          chmod +x gradlew
          ./gradlew build apiJar --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: bei-${{ matrix.id }}
          path: versions/${{ matrix.dir }}/build/libs/*.jar
