name: Release

# Pushing a version tag (for example 2026.11.2) builds the versions and loaders whose mod_version equals
# the tag and, only if all of them build, uploads each jar to CurseForge and attaches them to a GitHub release.
# Builds with another mod_version are skipped, so unchanged builds are never rebuilt or uploaded twice.
#
# One-time setup: add a repository secret named CURSEFORGE_TOKEN (a CurseForge API token from your
# account's API tokens page). Nothing is uploaded without it.
on:
  push:
    tags: ['20*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (must match mod_version)'
        required: true
      ref:
        description: 'Branch, tag or commit to check out (a dry run before the tag exists); defaults to the tag'
        required: false
        default: ''
      publish:
        description: 'Upload to CurseForge and create the GitHub release (leave off for a dry run that only builds)'
        type: boolean
        default: false

env:
  CURSEFORGE_PROJECT: '1783910'

jobs:
  # Only builds whose own mod_version equals the tag are built and uploaded; the rest are skipped with a
  # log line, so an unchanged build is never re-uploaded. The run fails when no build matches the tag.
  plan:
    name: Pick the builds for this tag
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - id: pick
        # Same rule as before, now in .github/scripts/plan_matrix.py: a build is picked when its own mod_version equals the
        # tag; the matrix entries keep dir, java, mc and loader. Fails when no build matches.
        run: python3 .github/scripts/plan_matrix.py release --tag "${{ inputs.tag || github.ref_name }}"

  build:
    name: Build ${{ matrix.dir }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: versions/${{ matrix.dir }}
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}-${{ matrix.loader }}
          path: |
            versions/${{ matrix.dir }}/build/libs/*.jar
            !versions/${{ matrix.dir }}/build/libs/*-api.jar
            !versions/${{ matrix.dir }}/build/libs/*-sources.jar

  publish:
    name: Publish ${{ matrix.dir }}
    needs: [plan, build]
    # A tag push always publishes; a manual run publishes only when "publish" is ticked.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.mc }}-${{ matrix.loader }}
          path: dist
      - name: Upload to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/**/*.jar
          name: Barely Enough Items ${{ inputs.tag || github.ref_name }} for ${{ matrix.loader }} ${{ matrix.mc }}
          version: ${{ inputs.tag || github.ref_name }}
          version-type: release
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.mc }}
          java: ${{ matrix.java }}
          changelog: "See the changelog: https://github.com/ItMeCasey/BEI/blob/main/CHANGELOG.md"
          fail-mode: fail
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.mc }}-${{ matrix.loader }}
          path: dist/**/*.jar

  github-release:
    name: GitHub release
    needs: publish
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body: |
            Barely Enough Items ${{ inputs.tag || github.ref_name }}. Pick the jar for your Minecraft version and loader.
            See the [changelog](https://github.com/ItMeCasey/BEI/blob/main/CHANGELOG.md) and the [wiki](https://itmecasey.com/wiki/bei/).
          files: dist/**/*.jar
