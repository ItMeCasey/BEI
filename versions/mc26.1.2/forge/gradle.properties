org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

# Minecraft and Forge. The ranges go into META-INF/mods.toml.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
forge_version=64.1.5
forge_version_range=[64,)
loader_version_range=[64,)

# Mod properties. They fill in the templates under src/main/templates, so a release only
# changes mod_version here.
mod_id=bei
mod_name=Barely Enough Items
mod_license=MIT
mod_version=2026.11.4
mod_group_id=com.itmecasey.bei
mod_authors=ItMeCasey
mod_description=A minimalist item and recipe viewer. The item browser stays hidden until you want it, and the Master Blueprint tracker breaks any item down into a nested crafting plan pinned to your HUD.

