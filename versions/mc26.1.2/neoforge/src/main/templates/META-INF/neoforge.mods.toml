# BEI metadata for NeoForge 26.1.2. generateModMetadata in build.gradle fills in the placeholders
# from gradle.properties.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/ItMeCasey/BEI/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/ItMeCasey/BEI"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# ModJS is optional: when present, BEI reads its recipe viewer scripts (see ModJsCompat).
[[dependencies.${mod_id}]]
    modId="modjs"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"
