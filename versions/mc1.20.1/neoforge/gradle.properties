org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx2G

# Minecraft and NeoForge (the 1.20.1 build keeps the net.minecraftforge package names).
# The ranges go into META-INF/mods.toml.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
neo_version=47.1.106
neo_version_range=[47.1.106,)
loader_version_range=[47,)

# Mod properties. They fill in the templates under src/main/templates, so a release only
# changes mod_version here.
mod_id=bei
mod_name=Barely Enough Items
mod_license=MIT
mod_version=2026.11.1
mod_group_id=com.itmecasey.bei
mod_authors=ItMeCasey
mod_description=A minimalist item and recipe viewer. The item browser stays out of the way until you want it, and the Master Blueprint tracker breaks any item down into a nested crafting plan pinned to your HUD.
