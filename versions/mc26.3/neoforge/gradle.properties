org.gradle.jvmargs=-Xmx2G
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

# Minecraft and NeoForge. The ranges go into META-INF/neoforge.mods.toml.
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
neo_version=26.3.0.101
neo_version_range=[26.3.0.101,)
# NeoForge's javafml loader range; NeoForge 21.1 uses FML 4.
loader_version_range=[4,)

# Mod properties. They fill in the templates under src/main/templates, so a release only
# changes mod_version here.
mod_id=bei
mod_name=Barely Enough Items
mod_license=MIT
mod_version=2026.11.6
mod_group_id=com.itmecasey.bei
mod_authors=ItMeCasey
mod_description=A minimalist item and recipe viewer. The item browser stays hidden until you want it, and the Master Blueprint tracker breaks any item down into a nested crafting plan pinned to your HUD.
