# BEI metadata for Forge 26.3. generateModMetadata in build.gradle fills in the placeholders
# from gradle.properties.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/ItMeCasey/BEI/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/ItMeCasey/BEI"
authors="${mod_authors}"
description='''${mod_description}'''

${jei_identity}
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# ModJS is optional: when present, BEI reads its recipe viewer scripts (see ModJsCompat).
[[dependencies.${mod_id}]]
    modId="modjs"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

[[mixins]]
config="bei.mixins.json"
