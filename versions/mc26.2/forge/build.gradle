plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = mod_version

// Jar name: smwti-forge-<minecraft version>-<mod version>
base {
    archivesName = 'bei-forge-26.2'
}
group = mod_group_id

repositories {
    maven { url = 'https://maven.blamejared.com' }
}

configurations {
    jeiApiEmbed
}

// The JEI-plugin bridge embeds JEI's public API and claims the "jei" mod id, so BEI replaces JEI and cannot be
// installed with the real JEI mod. To build without it:
//   gradlew build -Pbei_jei_bridge=false
boolean jeiBridge = (findProperty('bei_jei_bridge') ?: 'false').toString().toBoolean()
if (!jeiBridge) {
    sourceSets.main.java.exclude 'com/itmecasey/bei/compat/JeiBridge.java', 'com/itmecasey/bei/compat/JeiCompatMod.java'
    sourceSets.main.resources.exclude 'META-INF/LICENSE_jei.txt'
} 

dependencies {
    if (jeiBridge) {
        compileOnly "mezz.jei:jei-26.2-common-api:${jei_api_version}"
        jeiApiEmbed "mezz.jei:jei-26.2-common-api:${jei_api_version}"
    }
}

var extractJeiApi = tasks.register('extractJeiApi', Sync) {
    from({ configurations.jeiApiEmbed.collect { zipTree(it) } }) {
        include 'mezz/jei/api/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    into layout.buildDirectory.dir('generated/jeiApi')
}
if (jeiBridge) {
    sourceSets.main.output.dir(extractJeiApi)
}

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            // The example plugin (and only it) switches on for development runs.
            systemProperty 'bei.examples', 'true'
        }

        register('client') {
            // gradlew runClient -Pbei_quickplay=<save folder> joins that singleplayer world at once.
            if (findProperty('bei_quickplay')) {
                args '--quickPlaySingleplayer', findProperty('bei_quickplay').toString()
            }
        }

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'

    // Unit tests for the parts that do not need the game running.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// mods.toml and pack.mcmeta are templates: this fills in their ${} values from gradle.properties
// (a missing one is an error) and adds the result to the jar's resources.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            jei_identity           : jeiBridge ? """
# Bridge build only: compatibility identity for mods that declare a JEI dependency. Cannot coexist with real JEI.
[[mods]]
modId="jei"
version="${jei_api_version}"
displayName="JEI API compatibility provided by BEI"
authors="ItMeCasey"
description='''A minimal JEI API runtime that exposes JEI recipe plugins as BEI stations.'''
""" : '',
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}



// The public API on its own, for mods that add BEI plugins to compile against. It holds only the
// com.itmecasey.bei.api package, so a mod never sees BEI's internals.
tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from(sourceSets.main.output) {
        include 'com/itmecasey/bei/api/**'
    }
}
