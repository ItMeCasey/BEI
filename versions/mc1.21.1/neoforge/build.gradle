plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version

// Jar name: bei-neoforge-<minecraft version>-<mod version>
base {
    archivesName = 'bei-neoforge-1.21.1'
}
group = mod_group_id

repositories {
    maven { url = 'https://maven.blamejared.com' }
}

configurations {
    jeiApiEmbed
}

// The experimental JEI-plugin bridge is off in release builds. It embeds JEI's public API and claims the
// "jei" mod id, which cannot coexist with the real JEI mod. Turn it on for tests only:
//   gradlew build -Pbei_jei_bridge=true
boolean jeiBridge = (findProperty('bei_jei_bridge') ?: 'false').toString().toBoolean()
if (!jeiBridge) {
    sourceSets.main.java.exclude 'com/itmecasey/bei/compat/JeiBridge.java', 'com/itmecasey/bei/compat/JeiCompatMod.java'
    sourceSets.main.resources.exclude 'META-INF/LICENSE_jei.txt'
} 

// Mojang ships Java 21 to end users in 1.20.5+, so the mod targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        configureEach {
            gameDirectory = layout.projectDirectory.dir('run')
        }

        client {
            client()
            // gradlew runClient -Pbei_quickplay=<save folder> joins that singleplayer world at once.
            if (findProperty('bei_quickplay')) {
                programArguments.addAll('--quickPlaySingleplayer', findProperty('bei_quickplay').toString())
            }
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // The game's classes on the test classpath, so tests can use items and recipes.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    if (jeiBridge) {
        compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_api_version}"

        // Only the public API is embedded. BEI supplies the small runtime implementation used by the
        // recipe bridge; JEI's UI and implementation are deliberately not bundled.
        jeiApiEmbed "mezz.jei:jei-1.21.1-common-api:${jei_api_version}"
        jeiApiEmbed "mezz.jei:jei-1.21.1-neoforge-api:${jei_api_version}"
    }

    // Unit tests for the parts that do not need the game running.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var extractJeiApi = tasks.register('extractJeiApi', Sync) {
    from({ configurations.jeiApiEmbed.collect { zipTree(it) } }) {
        include 'mezz/jei/api/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    into layout.buildDirectory.dir('generated/jeiApi')
}
if (jeiBridge) {
    sourceSets.main.output.dir(extractJeiApi)
}


test {
    useJUnitPlatform()
}

// neoforge.mods.toml and pack.mcmeta are templates: this fills in their ${} values from gradle.properties
// (a missing one is an error) and adds the result to the jar's resources.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            jei_identity           : jeiBridge ? """
# Test builds only: compatibility identity for mods that declare a JEI dependency. Cannot coexist with real JEI.
[[mods]]
modId="jei"
version="${jei_api_version}"
displayName="JEI API compatibility provided by BEI"
authors="ItMeCasey"
description='''A minimal JEI API runtime that exposes JEI recipe plugins as BEI stations.'''
""".replace('${jei_api_version}', jei_api_version) : '',
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The public API on its own, for mods that support BEI to compile against. It holds only the
// com.itmecasey.bei.api package, so a mod never sees BEI's internals.
tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from(sourceSets.main.output) {
        include 'com/itmecasey/bei/api/**'
    }
}
